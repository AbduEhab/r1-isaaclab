[package]
name = "labd"
version = "0.1.0"
edition = "2021"
description = "Lab daemon: an in-memory training queue for the R1 Isaac Lab tasks, served on the LAN"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
