services:
  isaac:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ISAACSIM_IMAGE: nvcr.io/nvidia/isaac-sim:6.2.0
        ISAACLAB_TAG: v3.0.0
    image: isaac-env:6.2
    container_name: isaac
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      # The project, mounted from the host: no rebuild when code changes.
      - type: bind
        source: ..
        target: /workspace
      # Kit caches: without them every start recompiles shaders (minutes).
      - isaac-cache-kit:/isaac-sim/kit/cache
      - isaac-cache-ov:/root/.cache/ov
      - isaac-cache-gl:/root/.cache/nvidia/GLCache
      - isaac-logs:/root/.nvidia-omniverse/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    shm_size: "2gb"

volumes:
  isaac-cache-kit:
  isaac-cache-ov:
  isaac-cache-gl:
  isaac-logs:
